<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>单词打卡</title>
<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --ink: #20242b;
    --muted: #8b93a3;
    --line: #e7ebf2;
    --green: #34b96f;
    --green-soft: #e4f6ec;
    --red: #e05b5b;
    --red-soft: #fdeeee;
    --blue: #4a7cf7;
    --blue-soft: #eaf0fe;
    --amber: #f4a83a;
    --amber-soft: #fdf3e2;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 20px 16px 40px;
    position: relative;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
  }
  .brand-name {
    font-size: 17px;
    font-weight: 700;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .hero {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(38, 50, 72, 0.06);
    margin-bottom: 16px;
  }
  .hero-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .date-line {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .day-btn {
    border: 0;
    background: transparent;
    color: var(--blue);
    font-size: 13px;
    font-weight: 600;
    padding: 2px 4px;
    cursor: pointer;
  }
  .hero h1 {
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .hero h1 small {
    display: block;
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 6px;
  }
  .ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: conic-gradient(var(--green) calc(var(--p) * 1%), #edf1f6 0);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ring-inner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 6px 18px rgba(38, 50, 72, 0.04);
    border: 1px solid var(--line);
  }
  .stat .num {
    font-size: 24px;
    font-weight: 800;
  }
  .stat .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .stat.new .num { color: var(--blue); }
  .stat.review .num { color: var(--amber); }
  .btn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    background: var(--green);
    color: #fff;
    box-shadow: 0 8px 20px rgba(52, 185, 111, 0.25);
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: var(--blue-soft);
    color: var(--blue);
    box-shadow: none;
  }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    font-weight: 500;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(38, 50, 72, 0.06);
    margin-bottom: 14px;
  }
  .word-card {
    text-align: center;
    padding: 34px 20px;
  }
  .word-card .word {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 0;
    line-height: 1.15;
    overflow-wrap: break-word;
  }
  .word-card .hint {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .word-card .progress-line {
    margin-top: 22px;
    height: 6px;
    border-radius: 3px;
    background: #edf1f6;
    overflow: hidden;
  }
  .word-card .progress-fill {
    height: 100%;
    width: 0;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.25s;
  }
  .answer-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    font-size: 17px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--green); }
  .feedback {
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 12px;
    display: none;
    line-height: 1.5;
  }
  .feedback.right { display: block; background: var(--green-soft); color: #1f7a48; }
  .feedback.wrong { display: block; background: var(--red-soft); color: #a84242; }
  .feedback .correct-zh { font-weight: 700; }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }
  .option {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    padding: 14px 12px;
    font-size: 15px;
    text-align: center;
    cursor: pointer;
    color: var(--ink);
  }
  .option:active { background: var(--green-soft); border-color: var(--green); }
  .option.right { background: var(--green-soft); border-color: var(--green); }
  .option.wrong { background: var(--red-soft); border-color: var(--red); }
  .mode-switch {
    display: flex;
    gap: 8px;
    background: #eef1f6;
    padding: 5px;
    border-radius: 14px;
    margin-bottom: 14px;
  }
  .mode-switch button {
    flex: 1;
    border: 0;
    background: transparent;
    border-radius: 10px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .mode-switch button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 3px 10px rgba(38, 50, 72, 0.08);
  }
  .settings-section {
    display: none;
  }
  .settings-section.show { display: block; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .setting-row:last-child { border-bottom: 0; }
  .supplement-form {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .supplement-form input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
  }
  .supplement-form button {
    width: 100%;
    border: 0;
    background: var(--blue);
    color: #fff;
    border-radius: 12px;
    padding: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .word-list {
    max-height: 300px;
    overflow-y: auto;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .word-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  .word-row:last-child { border-bottom: 0; }
  .word-row .zh { color: var(--muted); text-align: right; }
  .done-view {
    text-align: center;
    padding: 36px 20px;
  }
  .done-view .big {
    font-size: 58px;
    margin-bottom: 10px;
  }
  .done-view h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .done-view p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(32, 36, 43, 0.92);
    color: #fff;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 20;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .back-home {
    position: fixed;
    top: calc(64px + env(safe-area-inset-top));
    left: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 4px 14px rgba(38, 50, 72, 0.12);
  }
  .privacy-note {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
    text-align: left;
  }
  .warn70 { color: var(--amber); }
  .warn90 { color: var(--red); }
  .admin-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .admin-stat {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .admin-stat .num { font-size: 18px; font-weight: 800; }
  .admin-stat .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .quota-bar {
    height: 6px;
    border-radius: 3px;
    background: #edf1f6;
    overflow: hidden;
    margin-top: 8px;
  }
  .quota-bar .fill { height: 100%; background: var(--green); border-radius: 3px; }
  .quota-bar.warn70 .fill { background: var(--amber); }
  .quota-bar.warn90 .fill { background: var(--red); }
  .admin-user {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .admin-user:last-child { border-bottom: 0; }
  .admin-user-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .remark-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .remark-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
  }
  .mini-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .mini-btn.danger { color: var(--red); border-color: var(--red-soft); background: var(--red-soft); }
  .mini-btn.blue { color: var(--blue); border-color: var(--blue-soft); background: var(--blue-soft); }
  .corr-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }
  .corr-item {
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .corr-item:last-child { border-bottom: 0; }
  .corr-item .en { font-weight: 700; }
  .corr-item .zh-line {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.5;
  }
  .corr-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-overlay.hidden {
    display: none;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 22px;
    padding: 30px 24px;
    box-shadow: 0 18px 50px rgba(38, 50, 72, 0.12);
    text-align: center;
  }
  .login-card .logo {
    margin: 0 auto 14px;
  }
  .login-card .site-name {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .login-card .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .login-card input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    margin-bottom: 10px;
    outline: none;
    background: var(--card);
  }
  .login-card input:focus {
    border-color: var(--green);
  }
  .login-card .btn {
    margin-bottom: 8px;
  }
  .login-card .auth-switch {
    border: 0;
    background: none;
    color: var(--blue);
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  .login-msg {
    min-height: 20px;
    font-size: 13px;
    color: var(--red);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="login-overlay hidden" id="loginOverlay">
  <div class="login-card">
    <div class="logo">祺</div>
    <div class="site-name" id="siteName">词加加</div>
    <div class="sub" id="authSub">手机号登录，独立保存你的进度</div>
    <input id="authPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="手机号">
    <input id="authPass" type="password" placeholder="密码（至少 6 位）">
    <div class="privacy-note" id="privacyNote" style="display:none">手机号仅用于登录和找回，不会公开</div>
    <button class="btn" id="authBtn" onclick="submitAuth()">登录</button>
    <button class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">没有账号？注册一个</button>
    <div class="login-msg" id="authMsg"></div>
  </div>
</div>
<div class="app">
  <button class="back-home" id="backHomeBtn" onclick="backHome()" aria-label="返回首页">‹</button>
  <header>
    <div class="brand">
      <div class="logo">祺</div>
      <div>
        <div class="brand-name" id="brandName">词加加</div>
        <div class="brand-sub">30 新词 + 艾宾浩斯复习</div>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" onclick="toggleSettings()">⚙</button>
  </header>

  <main id="mainView">
    <!-- 首页由 JS 渲染 -->
  </main>
</div>

<script>
// ========== 单词数据 ==========
// 正式使用时，把 SAMPLE_WORDS 替换成你的 1800 个单词。
// 每个单词格式：{ id: 序号, en: "英文", zh: "中文释义" }
const SAMPLE_WORDS = ALL_WORDS;
const SITE_NAME = "词加加";

// 每天新词数量
const NEW_PER_DAY = 30;
// 艾宾浩斯复习间隔（天）
const REVIEW_DAYS = [1, 2, 4, 7, 15, 30];
const STORAGE_KEY = "wordCheckinData_v2";

// ========== 工具函数 ==========
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayDiff(a, b) {
  const da = new Date(a + "T00:00:00");
  const db = new Date(b + "T00:00:00");
  return Math.round((db - da) / 86400000);
}

function getCurrentDay() {
  return state.viewDay || (dayDiff(state.startDate, todayStr()) + 1);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return (s || "").trim().toLowerCase().replace(/[，。、；;：:\s]/g, "");
}

// ========== 登录和服务器状态 ==========
let state = null;
let currentUser = null;
let authToken = localStorage.getItem("wordToken") || "";
let globalCorrections = {};
const WORD_QUOTA = 10000;

function defaultState() {
  return {
    startDate: todayStr(),
    blocks: [],
    nextBlockId: 1,
    viewDay: null,
    completedDays: {},
    days: {},
    myCorrections: {}
  };
}

function saveState() {
  if (!authToken || !state) return;
  fetch("/api/state", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + authToken
    },
    body: JSON.stringify({ state: state })
  }).catch(function() {});
}

function getAllWords() {
  const extra = [];
  for (const block of state.blocks || []) {
    for (let i = 0; i < (block.words || []).length; i++) {
      const w = block.words[i];
      extra.push({ id: "b" + block.id + "_" + i + "_" + w.en, en: w.en, zh: w.zh });
    }
  }
  return SAMPLE_WORDS.concat(extra);
}

function wordCorrectionKey(w) {
  return String(w.en || "").trim().toLowerCase();
}

function zhFor(w) {
  const key = wordCorrectionKey(w);
  if (state.myCorrections && state.myCorrections[key]) return state.myCorrections[key];
  if (globalCorrections && globalCorrections[key]) return globalCorrections[key];
  return w.zh;
}

function totalCustomWords() {
  return (state.blocks || []).reduce((n, b) => n + ((b.words || []).length), 0);
}

function quotaRatio(used) {
  return Math.min(100, Math.round(used / WORD_QUOTA * 100));
}

function warnClass(ratio) {
  if (ratio >= 0.9) return "warn90";
  if (ratio >= 0.7) return "warn70";
  return "";
}

function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function findWordByKey(key) {
  const k = String(key || "").trim().toLowerCase();
  const found = ALL_WORDS.find(w => String(w.en).toLowerCase() === k);
  if (found) return found;
  for (const b of state.blocks || []) {
    const f = (b.words || []).find(w => String(w.en).toLowerCase() === k);
    if (f) return f;
  }
  return null;
}

// 按当前日期计算今天应学的词
function buildTodayPlan() {
  const today = todayStr();
  const day = state.viewDay || (dayDiff(state.startDate, today) + 1);
  const words = getAllWords();
  const plan = [];
  const seen = new Set();

  // 新词：按序号顺序取
  if (day >= 1) {
    const start = (day - 1) * NEW_PER_DAY;
    const newWords = words.filter(w => w.id >= start + 1 && w.id <= start + NEW_PER_DAY);
    for (const w of newWords) {
      if (!seen.has(w.id)) {
        plan.push({ word: w, type: "new" });
        seen.add(w.id);
      }
    }
  }

  // 复习词：艾宾浩斯
  for (const offset of REVIEW_DAYS) {
    const learnDay = day - offset;
    if (learnDay < 1) continue;
    const start = (learnDay - 1) * NEW_PER_DAY;
    const reviewWords = words.filter(w => w.id >= start + 1 && w.id <= start + NEW_PER_DAY);
    for (const w of reviewWords) {
      if (!seen.has(w.id)) {
        plan.push({ word: w, type: "review" });
        seen.add(w.id);
      }
    }
  }

  return plan;
}

// ========== 音效 ==========
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function unlockAudio() {
  try {
    const ctx = getAudio();
    if (ctx.state === "suspended") ctx.resume();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) {}
}
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("touchstart", unlockAudio, { once: true });

async function playHappySound() {
  try {
    const ctx = getAudio();
    if (ctx.state === "suspended") await ctx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  } catch (e) {}
}

async function playWrongSound() {
  try {
    const ctx = getAudio();
    if (ctx.state === "suspended") await ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

// ========== 渲染 ==========
const mainView = document.getElementById("mainView");
const toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function setBackVisible(show) {
  const btn = document.getElementById("backHomeBtn");
  if (btn) btn.style.display = show ? "flex" : "none";
}

function toggleSettings() {
  const el = document.getElementById("settings");
  el.classList.toggle("show");
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderHome() {
  setBackVisible(false);
  const today = todayStr();
  const plan = buildTodayPlan();
  const day = getCurrentDay();
  const dayRecord = state.completedDays[day] || { done: false, records: {} };
  const correctCount = Object.values(dayRecord.records || {}).filter(v => v === true).length;
  const total = plan.length || 1;
  const pct = dayRecord.done ? 100 : Math.round(correctCount / total * 100);
  const newCount = plan.filter(p => p.type === "new").length;
  const reviewCount = plan.filter(p => p.type === "review").length;
  const suppCount = plan.filter(p => p.type === "supplement").length;
  const streak = calcStreak();
  const blockCount = (state.blocks || []).length;
  const blockWordCount = (state.blocks || []).reduce((n, b) => n + (b.words || []).length, 0);
  const quotaCls = warnClass(blockWordCount / WORD_QUOTA);

  mainView.innerHTML = `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="date-line">${today} · <button class="day-btn" onclick="changeDay()">第 ${state.viewDay || dayDiff(state.startDate, today) + 1} 天</button>${state.viewDay ? ' <button class="day-btn" onclick="backToToday()">回到今天</button>' : ''}</div>
          <h1>${dayRecord.done ? "第 " + day + " 天已完成" : "开始第 " + day + " 天的单词吧"}<small>连续打卡 ${streak} 天</small></h1>
        </div>
        <div class="ring" style="--p:${pct}">
          <div class="ring-inner">${pct}%</div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat new"><div class="num">${newCount}</div><div class="label">新词</div></div>
      <div class="stat review"><div class="num">${reviewCount}</div><div class="label">复习</div></div>
    </div>
    <div class="card" style="cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px" onclick="renderBlocksView()">
      <div>
        <div style="font-size:16px;font-weight:700">新建词汇</div>
        <div style="font-size:12px;color:var(--muted)">${blockCount} 个词库 · <span class="${quotaCls}">${blockWordCount} / 10000 词</span></div>
      </div>
      <span style="color:var(--muted);font-size:22px">›</span>
    </div>
    <button class="btn" onclick="startCheckin()">${dayRecord.done ? "重新打卡" : "开始打卡"}</button>

    <div class="settings-section" id="settings" style="margin-top:16px">
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">进度</div>
        <div class="setting-row"><span>起始日期</span><span style="color:var(--muted)">${state.startDate}</span></div>
        <div class="setting-row"><span>第 ${day} 天已答对</span><span style="color:var(--green)">${correctCount} / ${plan.length}</span></div>
        <button class="btn secondary" onclick="changeStartDate()" style="margin-top:12px">修改起始日期</button>
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">修改密码</div>
        <div class="supplement-form" style="margin-top:8px">
          <input id="oldPass" type="password" placeholder="当前密码" autocomplete="current-password">
          <input id="newPass" type="password" placeholder="新密码" autocomplete="new-password">
          <input id="newPass2" type="password" placeholder="再输一次新密码" autocomplete="new-password">
          <button class="btn secondary" style="border:0;background:var(--blue-soft);color:var(--blue)" onclick="changePassword()">保存新密码</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">${currentUser.is_admin ? "管理员密码需 12 位以上，含大小写、数字和符号" : "密码至少 6 位"}</div>
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">释义修正</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">修正后只对自己生效，可随时恢复默认</div>
        <button class="btn secondary" onclick="renderMyCorrections()">我的释义修正</button>
      </div>
      <div class="card" id="adminCard" style="display:none">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">管理员</div>
        <button class="btn secondary" onclick="renderAdmin()">管理账号</button>
      </div>
      <button class="btn ghost" onclick="logout()" style="margin-top:4px">退出登录</button>
    </div>
  `;
  const adminCard = document.getElementById("adminCard");
  if (adminCard && currentUser && currentUser.is_admin) {
    adminCard.style.display = "block";
  }
}

async function changePassword() {
  const oldPass = document.getElementById("oldPass").value;
  const newPass = document.getElementById("newPass").value;
  const newPass2 = document.getElementById("newPass2").value;
  if (!oldPass || !newPass) {
    showToast("请填写完整");
    return;
  }
  if (newPass !== newPass2) {
    showToast("两次新密码不一致");
    return;
  }
  const res = await fetch("/api/change-password", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
    body: JSON.stringify({ old_password: oldPass, new_password: newPass })
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || "修改失败");
    return;
  }
  document.getElementById("oldPass").value = "";
  document.getElementById("newPass").value = "";
  document.getElementById("newPass2").value = "";
  showToast("密码已修改");
}

function changeStartDate() {
  const val = prompt("起始日期（YYYY-MM-DD）：", state.startDate);
  if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
    state.startDate = val;
    saveState();
    renderHome();
    showToast("起始日期已修改");
  }
}

function changeDay() {
  const current = state.viewDay || dayDiff(state.startDate, todayStr()) + 1;
  const val = prompt("输入要查看第几天（1-60）：", current);
  const n = parseInt(val, 10);
  if (n >= 1 && n <= 60) {
    state.viewDay = n;
    saveState();
    renderHome();
  } else if (val !== null) {
    showToast("请输入 1 到 60 之间的天数");
  }
}

function backToToday() {
  state.viewDay = null;
  saveState();
  renderHome();
}

function renderBlocksView() {
  setBackVisible(true);
  const blocks = state.blocks || [];
  const used = totalCustomWords();
  const quotaCls = warnClass(used / WORD_QUOTA);
  mainView.innerHTML = `
    <div class="card" style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:20px;font-weight:700">新建词汇</div>

function renderBlockList() {
  const el = document.getElementById("blockList");
  if (!el) return;

    el.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">还没有词库，点上面按钮新建一个</div>';

      </div>
      <span style="color:var(--muted);font-size:22px">›</span>

  `).join("");
}

function createBlock() {
  const name = prompt("词库名称（例如：四级词汇、短语、考研词）", "");
  if (!name || !name.trim()) return;
  state.blocks = state.blocks || [];
  state.blocks.push({ id: state.nextBlockId++, name: name.trim(), words: [] });
  saveState();
  renderBlocksView();
  showToast("已新建词库");
}

function renderBlockDetail(id) {
  setBackVisible(true);
  const block = (state.blocks || []).find(b => b.id === id);
  if (!block) { renderBlocksView(); return; }
  const words = block.words || [];
  mainView.innerHTML = `
    <div class="card" style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:20px;font-weight:700">${esc(block.name)}</div>
          <button class="mini-btn" onclick="renameBlock(${id})">重命名</button>
        </div>
        <div style="font-size:12px;color:var(--muted)">${words.length} 个词</div>
      </div>
      <button class="icon-btn" onclick="renderBlocksView()">‹</button>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">添加单词 / 短语</div>
      <div class="supplement-form">
        <input id="blkEn" type="text" placeholder="英文 / 短语">
        <input id="blkZh" type="text" placeholder="中文意思">
        <button onclick="addBlockWord(${id})">添加</button>
      </div>
    </div>
    <button class="btn" style="margin-bottom:14px" onclick="startBlockCheckin(${id})">记这个词库</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:15px;font-weight:700">词库内容</div>
        <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:12px;color:var(--red)" onclick="deleteBlock(${id})">删除词库</button>
      </div>
      <div class="word-list" id="blkWordList"></div>
    </div>
  `;
  renderBlockWords(id);
}

function renderBlockWords(id) {
  const el = document.getElementById("blkWordList");
  if (!el) return;
  const block = (state.blocks || []).find(b => b.id === id);
  const words = block ? (block.words || []) : [];
  if (!words.length) {
    el.innerHTML = '<div class="word-row"><span>还没有词</span><span class="zh"></span></div>';
    return;
  }
  el.innerHTML = words.map((w, i) => `
    <div class="word-row">
      <span>${esc(w.en)}</span>
      <span class="zh">${esc(w.zh)} <button class="mini-btn" onclick="editBlockWord(${id}, ${i})">改</button> <button class="mini-btn danger" onclick="deleteBlockWord(${id}, ${i})">删</button></span>
    </div>
  `).join("");
}

function renameBlock(id) {
  const block = (state.blocks || []).find(b => b.id === id);
  if (!block) return;
  const name = prompt("词库名称：", block.name);
  if (name === null) return;
  if (!name.trim()) {
    showToast("名称不能为空");
    return;
  }
  block.name = name.trim();
  saveState();
  renderBlockDetail(id);
  showToast("已重命名");
}

function addBlockWord(id) {
  const en = document.getElementById("blkEn").value.trim();
  const zh = document.getElementById("blkZh").value.trim();
  if (!en || !zh) {
    showToast("英文和中文都要填");
    return;
  }
  if (totalCustomWords() >= WORD_QUOTA) {
    showToast("自定义词库已达 10000 词上限，请先删除一些词");
    return;
  }
  const block = (state.blocks || []).find(b => b.id === id);
  if (!block) return;
  block.words = block.words || [];
  block.words.push({ en, zh });
  saveState();
  document.getElementById("blkEn").value = "";
  document.getElementById("blkZh").value = "";
  renderBlockDetail(id);
  showToast("已添加：" + en);
}

function editBlockWord(id, idx) {
  const block = (state.blocks || []).find(b => b.id === id);
  if (!block || !block.words[idx]) return;
  const w = block.words[idx];
  const en = prompt("英文 / 短语：", w.en);
  if (en === null) return;
  const zh = prompt("中文意思：", w.zh);
  if (zh === null) return;
  if (!en.trim() || !zh.trim()) {
    showToast("英文和中文都要填");
    return;
  }
  w.en = en.trim();
  w.zh = zh.trim();
  saveState();
  renderBlockDetail(id);
  showToast("已修改");
}

function deleteBlockWord(id, idx) {
  const block = (state.blocks || []).find(b => b.id === id);
  if (!block) return;
  block.words.splice(idx, 1);
  saveState();
  renderBlockDetail(id);
}

function deleteBlock(id) {
  if (!confirm("确定删除这个词库吗？")) return;
  state.blocks = (state.blocks || []).filter(b => b.id !== id);
  saveState();
  renderBlocksView();
}

function backHome() {
  renderHome();
}

function calcStreak() {
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const rec = state.days[key];
    if (rec && rec.done) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ========== 打卡流程 ==========
let quiz = null;

function startCheckin() {
  const plan = buildTodayPlan();
  if (!plan.length) {
    showToast("这一天没有要背的词");
    return;
  }
  const day = getCurrentDay();
  const dayRecord = state.completedDays[day] || { done: false, records: {} };
  quiz = {
    today: todayStr(),
    day,
    queue: shuffle(plan),
    wrong: [],
    current: null,
    correct: dayRecord.done ? 0 : 0,
    locked: false,
    origin: "daily"
  };
  renderQuiz();
}

function startBlockCheckin(blockId) {
  const block = (state.blocks || []).find(b => b.id === blockId);
  if (!block || !(block.words || []).length) {
    showToast("这个词库还没有词");
    return;
  }
  const plan = block.words.map(w => ({
    word: { id: "b" + block.id + "_" + w.en, en: w.en, zh: w.zh },
    type: "supplement"
  }));
  quiz = {
    today: todayStr(),
    queue: shuffle(plan),
    wrong: [],
    current: null,
    correct: 0,
    locked: false,
    origin: "block"
  };
  renderQuiz();
}

function renderQuiz() {
  setBackVisible(true);
  const q = quiz;
  if (!q) return;
  q.locked = false;
  if (!q.queue.length && !q.wrong.length) {
    finishCheckin();
    return;
  }
  if (!q.queue.length) {
    q.queue = shuffle(q.wrong);
    q.wrong = [];
  }
  q.current = q.queue.shift();
  const total = buildTodayPlan().length;
  const progress = Math.min(100, Math.round((total - q.queue.length - q.wrong.length) / total * 100));
  const hasMyCorr = !!(state.myCorrections || {})[wordCorrectionKey(q.current.word)];

  mainView.innerHTML = `
    <div class="word-card card">
      <div class="word">${esc(q.current.word.en)}</div>
      <div class="hint">${q.current.type === "new" ? "新词" : q.current.type === "review" ? "复习" : "补充"}</div>
      <div class="progress-line"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="mode-switch">
      <button class="active" id="modeChoice" onclick="setMode('choice')">选择题</button>
      <button id="modeInput" onclick="setMode('input')">手打答案</button>
      <button id="modeSelf" onclick="setMode('self')">自测</button>
    </div>
    <div id="quizBody"></div>
    <div class="corr-row">
      <button class="btn ghost" style="width:auto;padding:8px 14px;font-size:13px" onclick="editCurrentDefinition()">修正释义</button>
      ${hasMyCorr ? '<button class="btn ghost" style="width:auto;padding:8px 14px;font-size:13px" onclick="resetCurrentDefinition()">恢复默认</button>' : ""}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
  setMode("choice");
}

function editCurrentDefinition() {
  const w = quiz.current.word;
  const val = prompt("修正释义（仅自己可见，可随时恢复默认）：", zhFor(w));
  if (val === null) return;
  const v = val.trim();
  if (!v) {
    showToast("释义不能为空");
    return;
  }
  if (!state.myCorrections) state.myCorrections = {};
  state.myCorrections[wordCorrectionKey(w)] = v;
  saveState();
  renderQuiz();
  showToast("已保存到我的释义修正");
}

function resetCurrentDefinition() {
  if (!confirm("恢复这个单词的默认释义？")) return;
  if (state.myCorrections) delete state.myCorrections[wordCorrectionKey(quiz.current.word)];
  saveState();
  renderQuiz();
  showToast("已恢复默认释义");
}

let mode = "choice";

function setMode(m) {
  mode = m;
  const buttons = {
    choice: document.getElementById("modeChoice"),
    input: document.getElementById("modeInput"),
    self: document.getElementById("modeSelf")
  };
  for (const k in buttons) buttons[k].classList.toggle("active", k === m);
  const body = document.getElementById("quizBody");
  if (m === "choice") {
    body.innerHTML = buildChoiceHTML();
    body.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", function() { answerChoice(this.dataset.idx); });
    });
  } else if (m === "input") {
    body.innerHTML = `
      <div class="answer-row">
        <input id="answerInput" type="text" placeholder="输入中文意思" autocomplete="off" autocapitalize="off">
        <button class="btn secondary" style="width:auto;padding:0 18px" onclick="checkInput()">检查</button>
      </div>
      <button class="btn ghost" onclick="dontKnow()">不认识</button>
    `;
    const inp = document.getElementById("answerInput");
    inp.focus();
    inp.addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkInput();
    });
  } else {
    body.innerHTML = `
      <button class="btn secondary" onclick="revealAnswer()">显示答案</button>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" style="flex:1" onclick="selfGrade(true)">答对了</button>
        <button class="btn" style="flex:1;background:var(--red);box-shadow:none" onclick="selfGrade(false)">答错了</button>
      </div>
    `;
  }
}

function buildChoiceHTML() {
  const w = quiz.current.word;
  const all = getAllWords();
  const pool = all.filter(x => x.id !== w.id && zhFor(x) !== zhFor(w));
  const distractors = shuffle(pool).slice(0, 3);
  const options = shuffle([w, ...distractors]);
  return `
    <div class="options">
      ${options.map((o, i) => `<button class="option" data-idx="${i}" data-zh="${encodeURIComponent(zhFor(o))}">${esc(zhFor(o))}</button>`).join("")}
    </div>
  `;
}

function answerChoice(idx) {
  if (quiz.locked) return;
  const w = quiz.current.word;
  const btn = document.querySelectorAll(".option")[idx];
  const chosenZh = decodeURIComponent(btn.dataset.zh);
  const buttons = document.querySelectorAll(".option");
  if (chosenZh === zhFor(w)) {
    btn.classList.add("right");
    showFeedback(true, "回答正确！", zhFor(w));
    markWord(true);
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b => {
      if (decodeURIComponent(b.dataset.zh) === zhFor(w)) b.classList.add("right");
    });
    showFeedback(false, "回答错误", zhFor(w));
    markWord(false);
  }
}

function checkInput() {
  if (quiz.locked) return;
  const inp = document.getElementById("answerInput");
  const ans = normalize(inp ? inp.value : "");
  const w = quiz.current.word;
  const zh = normalize(zhFor(w));
  const zhParts = zhFor(w).split(/[；;]/).map(normalize).filter(Boolean);
  if (ans && (ans === zh || zhParts.includes(ans))) {
    showFeedback(true, "回答正确！", zhFor(w));
    markWord(true);
  } else {
    showFeedback(false, "回答错误", zhFor(w));
    markWord(false);
  }
}

function revealAnswer() {
  const w = quiz.current.word;
  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.style.display = "block";
  fb.innerHTML = `正确意思：<span class="correct-zh">${esc((w.pos ? "[" + w.pos + "] " : "") + zhFor(w))}</span>`;
}

function selfGrade(ok) {
  if (quiz.locked) return;
  const w = quiz.current.word;
  if (ok) {
    showFeedback(true, "回答正确！", zhFor(w));
    markWord(true);
  } else {
    showFeedback(false, "回答错误", zhFor(w));
    markWord(false);
  }
}

function dontKnow() {
  if (quiz.locked) return;
  const w = quiz.current.word;
  showFeedback(false, "回答错误", zhFor(w));
  markWord(false);
}

function showFeedback(ok, title, correctZh) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (ok ? "right" : "wrong");
  const w = quiz.current.word;
  const full = (w.pos ? "[" + w.pos + "] " : "") + correctZh;
  fb.innerHTML = `<strong>${ok ? "✓" : "✗"} ${esc(title)}</strong><br>正确意思：<span class="correct-zh">${esc(full)}</span>`;
}

function markWord(ok) {
  const q = quiz;
  const w = q.current.word;
  if (ok) {
    playHappySound();
    if (q.origin !== "block") {
      const rec = state.completedDays[q.day] || { done: false, records: {} };
      rec.records[w.id] = true;
      state.completedDays[q.day] = rec;
      saveState();
    }
    q.locked = true;
    setTimeout(renderQuiz, 650);
  } else {
    playWrongSound();
    q.locked = true;
    const fb = document.getElementById("feedback");
    fb.innerHTML += '<button class="btn" style="margin-top:12px" onclick="continueAfterWrong()">继续</button>';
  }
}

function continueAfterWrong() {
  const q = quiz;
  q.wrong.push(q.current);
  q.locked = false;
  renderQuiz();
}

function finishCheckin() {
  setBackVisible(true);
  const today = quiz ? quiz.today : todayStr();
  const day = quiz ? quiz.day : getCurrentDay();
  const isBlock = quiz && quiz.origin === "block";
  if (!isBlock) {
    state.completedDays[day] = { done: true, records: (state.completedDays[day] || {}).records || {} };
    if (day === getCurrentDay() && !state.viewDay) {
      state.days[today] = { done: true, records: state.completedDays[day].records };
    }
    saveState();
  }
  playHappySound();
  mainView.innerHTML = `
    <div class="card done-view">
      <div class="big">🎉</div>
      <h2>${isBlock ? "词库完成" : "今日打卡完成"}</h2>
      <p>${isBlock ? "这个词库所有单词都答对了" : "今天所有单词都答对了<br>明天也要继续哦"}</p>
      <button class="btn" onclick="${isBlock ? "renderBlocksView()" : "renderHome()"}">${isBlock ? "返回词库" : "回到首页"}</button>
    </div>
  `;
}

// ========== 登录 ==========
let authMode = "login";

function showLogin() {
  setBackVisible(false);
  document.getElementById("loginOverlay").classList.remove("hidden");
}

function hideLogin() {
  document.getElementById("loginOverlay").classList.add("hidden");
}

function toggleAuthMode() {
  authMode = authMode === "login" ? "register" : "login";
  document.getElementById("authSub").textContent = authMode === "login"
    ? "手机号登录，独立保存你的进度"
    : "注册新账号，数据独立保存";
  document.getElementById("authBtn").textContent = authMode === "login" ? "登录" : "注册";
  document.getElementById("authSwitch").textContent = authMode === "login"
    ? "没有账号？注册一个"
    : "已有账号？去登录";
  document.getElementById("authMsg").textContent = "";
  document.getElementById("privacyNote").style.display = authMode === "register" ? "block" : "none";
}

async function submitAuth() {
  const phone = document.getElementById("authPhone").value.trim();
  const password = document.getElementById("authPass").value;
  const msg = document.getElementById("authMsg");
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    msg.textContent = "请输入正确的 11 位手机号";
    return;
  }
  if (password.length < 6) {
    msg.textContent = "密码至少 6 位";
    return;
  }
  msg.textContent = "请稍候...";
  try {
    const res = await fetch("/api/" + (authMode === "login" ? "login" : "register"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, password })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || "出错了";
      return;
    }
    authToken = data.token;
    currentUser = data.user;
    localStorage.setItem("wordToken", authToken);
    await loadUserState();
    hideLogin();
    renderHome();
  } catch (e) {
    msg.textContent = "网络错误，请重试";
  }
}

async function boot() {
  document.getElementById("siteName").textContent = SITE_NAME;
  document.getElementById("brandName").textContent = SITE_NAME;
  if (!authToken) {
    showLogin();
    return;
  }
  try {
    const meRes = await fetch("/api/me", {
      headers: { "Authorization": "Bearer " + authToken }
    });
    if (!meRes.ok) {
      localStorage.removeItem("wordToken");
      authToken = "";
      showLogin();
      return;
    }
    const meData = await meRes.json();
    currentUser = meData.user;
    await loadUserState();
    hideLogin();
    renderHome();
  } catch (e) {
    showLogin();
  }
}

async function loadUserState() {
  const res = await fetch("/api/state", {
    headers: { "Authorization": "Bearer " + authToken }
  });
  const data = await res.json();
  state = data.state && data.state.startDate ? data.state : defaultState();
  if (!state.startDate) state.startDate = todayStr();
  state.blocks = state.blocks || [];
  state.nextBlockId = state.nextBlockId || 1;
  state.viewDay = state.viewDay || null;
  state.completedDays = state.completedDays || {};
  state.days = state.days || {};
  state.myCorrections = state.myCorrections || {};
  await loadCorrections();
}

async function loadCorrections() {
  try {
    const res = await fetch("/api/corrections", {
      headers: { "Authorization": "Bearer " + authToken }
    });
    if (res.ok) {
      const data = await res.json();
      globalCorrections = (data.global && typeof data.global === "object") ? data.global : {};
    }
  } catch (e) {}
}

async function logout() {
  if (authToken) {
    try {
      await fetch("/api/logout", {
        method: "POST",
        headers: { "Authorization": "Bearer " + authToken }
      });
    } catch (e) {}
  }
  authToken = "";
  currentUser = null;
  state = null;
  localStorage.removeItem("wordToken");
  showLogin();
}

function renderMyCorrections() {
  setBackVisible(true);
  const my = state.myCorrections || {};
  const keys = Object.keys(my).sort();
  mainView.innerHTML = `
    <div class="card" style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:20px;font-weight:700">我的释义修正</div>
        <div style="font-size:12px;color:var(--muted)">仅自己可见 · ${keys.length} 条</div>
      </div>
      <button class="icon-btn" onclick="renderHome()">‹</button>
    </div>
    <button class="btn secondary" onclick="addMyCorrection()" style="margin-bottom:12px">添加修正</button>
    <div class="card" style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px">修正后的释义只对你自己生效；想恢复原版释义，点“恢复默认”即可。</div>
    <div class="card" id="myCorrList"></div>
  `;

  if (!keys.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:12px 0">还没有修正记录</div>';
    return;
  }
  el.innerHTML = keys.map((k, i) => {
    const w = findWordByKey(k);
    const defaultZh = w ? w.zh : "（未找到原词）";
    return `
      <div class="corr-item">
        <div class="en">${esc(k)}</div>
        <div class="zh-line">原释义：${esc(defaultZh)}</div>
        <div class="zh-line">我的释义：${esc(my[k])}</div>
        <div class="corr-actions">
          <button class="mini-btn blue" onclick="editMyCorrection(${i})">编辑</button>
          <button class="mini-btn danger" onclick="resetMyCorrection(${i})">恢复默认</button>
        </div>
      </div>
    `;
  }).join("");
}

function addMyCorrection() {
  const word = prompt("要修正哪个单词？（英文）", "");
  if (!word || !word.trim()) return;
  const key = word.trim().toLowerCase();
  const w = findWordByKey(key);
  const zh = prompt("修正后的中文释义：", w ? w.zh : "");
  if (zh === null || !zh.trim()) return;
  if (!state.myCorrections) state.myCorrections = {};
  state.myCorrections[key] = zh.trim();
  saveState();
  renderMyCorrections();
  showToast("已保存");
}

function editMyCorrection(idx) {
  const keys = Object.keys(state.myCorrections || {}).sort();
  const k = keys[idx];
  const zh = prompt("修改后的中文释义：", state.myCorrections[k]);
  if (zh === null || !zh.trim()) return;
  state.myCorrections[k] = zh.trim();
  saveState();
  renderMyCorrections();
  showToast("已更新");
}

function resetMyCorrection(idx) {
  const keys = Object.keys(state.myCorrections || {}).sort();
  const k = keys[idx];
  if (!confirm("恢复这个单词的默认释义？")) return;
  delete state.myCorrections[k];
  saveState();
  renderMyCorrections();
  showToast("已恢复默认");
}

let adminGlobalCorrections = {};

function formatBytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}

async function refreshAdminQuietly() {
  if (adminRefreshing) return;
  const active = document.activeElement;
  if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;
  adminRefreshing = true;
  try {
    await renderAdmin();
  } finally {
    adminRefreshing = false;
  }
}

async function renderAdmin() {
  setBackVisible(true);
  mainView.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">加载中...</div>';
  const res = await fetch("/api/admin/users", {
    headers: { "Authorization": "Bearer " + authToken }
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || "没有权限");
    renderHome();
    return;
  }
  adminGlobalCorrections = data.global_corrections || {};
  const maxText = data.max_users > 0 ? String(data.max_users) : "不限";
  const dbSizeText = formatBytes(data.db_size);
  const quotaText = formatBytes(data.free_quota);
  const usageRatio = data.free_quota > 0 ? data.db_size / data.free_quota : 0;
  const usagePct = Math.min(100, Math.round(usageRatio * 100));
  const usageCls = warnClass(usageRatio);
  const gcKeys = Object.keys(adminGlobalCorrections).sort();
  mainView.innerHTML = `
    <div class="card" style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:20px;font-weight:700">管理员</div>
        <div style="font-size:12px;color:var(--muted)">当前名额 ${data.max_users > 0 ? data.max_users + " 人" : "不限"}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="mini-btn" onclick="refreshAdminQuietly()">刷新</button>
        <button class="icon-btn" onclick="renderHome()">‹</button>
      </div>
    </div>
    <div class="admin-stats">
      <div class="admin-stat"><div class="num">${dbSizeText}</div><div class="label">数据库大小</div></div>
      <div class="admin-stat"><div class="num">${data.registered_count}<span style="font-size:11px"> / ${maxText}</span></div><div class="label">已注册 / 名额</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>总用量 / 免费额度</span>
        <span class="${usageCls}">${usagePct}%</span>
      </div>
      <div class="quota-bar ${usageCls}"><div class="fill" style="width:${usagePct}%"></div></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">数据库 ${dbSizeText} / ${quotaText}，达到 70% 变黄、90% 变红</div>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:8px">修改注册名额</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">填 0 表示不限；最多可设 999999。</div>
      <div class="remark-row">
        <input id="maxUsersInput" type="number" min="0" max="999999" value="${data.max_users}">
        <button class="mini-btn blue" onclick="setUnlimitedQuota()">设为不限</button>
        <button class="btn secondary" style="width:auto;padding:8px 14px" onclick="updateMaxUsers()">保存</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:8px">已注册账号</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">每人自定义词库总词数上限 ${data.word_quota} 个</div>
      <div id="adminUserList"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:15px;font-weight:700">全局释义修正</div>
        <button class="mini-btn blue" onclick="addGlobalCorrection()">添加</button>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:4px">对所有用户生效；普通用户仍可另存自己的释义修正。</div>
      <div id="globalCorrList">${gcKeys.length ? gcKeys.map((k, i) => {
        return `
          <div class="corr-item">
            <div class="en">${esc(k)}</div>
            <div class="zh-line">${esc(adminGlobalCorrections[k])}</div>
            <div class="corr-actions">
              <button class="mini-btn blue" onclick="editGlobalCorrection(${i})">编辑</button>
              <button class="mini-btn danger" onclick="deleteGlobalCorrection(${i})">删除</button>
            </div>
          </div>`;
      }).join("") : '<div style="text-align:center;color:var(--muted);padding:10px 0">还没有全局修正</div>'}</div>
    </div>
  `;
  document.getElementById("adminUserList").innerHTML = data.users.length ? data.users.map(u => {
    const ratio = u.word_count / data.word_quota;
    const qCls = warnClass(ratio);
    return `
      <div class="admin-user">
        <div class="admin-user-top">
          <span style="font-size:13px;font-weight:700;white-space:nowrap">${esc(u.phone)}${u.is_admin ? ' <span style="color:var(--blue);font-size:11px">管理员</span>' : ""}</span>
          ${u.is_admin ? "" : `
          <input id="remarkInput${u.id}" type="text" placeholder="备注" value="${escAttr(u.remark)}" style="flex:1;min-width:0;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;outline:none">
          <button class="mini-btn blue" style="white-space:nowrap;padding:6px 8px;font-size:12px" onclick="updateRemark(${u.id})">保存备注</button>
          <button class="mini-btn danger" style="white-space:nowrap;padding:6px 8px;font-size:12px" onclick="deleteUser(${u.id})">删除</button>`}
        </div>
        <div class="admin-user-usage" style="font-size:12px;color:var(--muted);margin-top:4px">词库 ${u.block_count} · 单词 <span class="${qCls}">${u.word_count} / ${data.word_quota}</span></div>
      </div>
    `;
  }).join("") : '<div style="text-align:center;color:var(--muted);padding:12px 0">还没有账号</div>';
}

function setUnlimitedQuota() {
  document.getElementById("maxUsersInput").value = "0";
  showToast("填 0 表示不限，点保存生效");
}

async function updateMaxUsers() {
  const val = parseInt(document.getElementById("maxUsersInput").value, 10);
  if (isNaN(val) || val < 0 || val > 999999) {
    showToast("名额需为 0（不限）或 1 到 999999");
    return;
  }
  const res = await fetch("/api/admin/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
    body: JSON.stringify({ max_users: val })
  });
  const data = await res.json();
  if (res.ok) {
    showToast(val === 0 ? "已设为不限" : "名额已改为 " + val);
    renderAdmin();
  } else {
    showToast(data.error || "修改失败");
  }
}

async function updateRemark(id) {
  const remark = document.getElementById("remarkInput" + id).value.trim();
  const res = await fetch("/api/admin/users/" + id + "/remark", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
    body: JSON.stringify({ remark: remark })
  });
  const data = await res.json();
  if (res.ok) {
    showToast("备注已保存");
  } else {
    showToast(data.error || "保存失败");
  }
}

async function deleteUser(id) {
  if (!confirm("确定删除这个账号吗？删除后名额会空出来")) return;
  const res = await fetch("/api/admin/users/" + id + "/delete", {
    method: "POST",
    headers: { "Authorization": "Bearer " + authToken }
  });
  const data = await res.json();
  if (res.ok) {
    showToast("已删除");
    renderAdmin();
  } else {
    showToast(data.error || "删除失败");
  }
}

async function saveGlobalCorrection(word, zh) {
  const res = await fetch("/api/admin/global-corrections", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
    body: JSON.stringify({ word: word, zh: zh })
  });
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || "保存失败");
    return false;
  }
  return true;
}

async function addGlobalCorrection() {
  const word = prompt("要修正哪个单词？（英文）", "");
  if (!word || !word.trim()) return;
  const key = word.trim().toLowerCase();
  const w = findWordByKey(key);
  const zh = prompt("修正后的中文释义：", w ? w.zh : "");
  if (zh === null || !zh.trim()) return;
  if (await saveGlobalCorrection(key, zh.trim())) {
    showToast("已保存全局修正");
    renderAdmin();
  }
}

async function editGlobalCorrection(idx) {
  const keys = Object.keys(adminGlobalCorrections || {}).sort();
  const k = keys[idx];
  const zh = prompt("修改后的中文释义：", adminGlobalCorrections[k]);
  if (zh === null || !zh.trim()) return;
  if (await saveGlobalCorrection(k, zh.trim())) {
    showToast("已更新");
    renderAdmin();
  }
}

async function deleteGlobalCorrection(idx) {
  const keys = Object.keys(adminGlobalCorrections || {}).sort();
  const k = keys[idx];
  if (!confirm("删除这条全局释义修正？")) return;
  if (await saveGlobalCorrection(k, "")) {
    showToast("已删除");
    renderAdmin();
  }
}

// 初始化
boot();
</script>
</body>
</html>
